<style>
  /* Self-contained: every class starts with "mh-". The menus (WhatsApp, Telegram, Spotify) open upward from their icon. */
  .mh, .mh * { box-sizing: border-box; }
  body { margin: 0; }

  .mh::before { content:''; position:absolute; inset:0; pointer-events:none;
        background-image:url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M40 4 L76 40 L40 76 L4 40 Z' fill='none' stroke='%23c9a46b' stroke-width='0.5' stroke-opacity='0.12'/%3E%3C/svg%3E"); }
  .mh-inner { position:relative; z-index:1; max-width:760px; width:100%; }
  .mh-top { display:block; width:clamp(260px,42%,420px); margin:0 auto -.5rem; mix-blend-mode:screen; opacity:.92; }
  .mh-eyebrow { font-family:'Cinzel',serif; font-size:.9rem; font-style:italic; color:var(--gold); letter-spacing:.06em; margin:0 0 .5rem; opacity:.92; text-transform:uppercase; }
  .mh-title { font-family:'Cinzel',serif; font-weight:600; font-size:clamp(2.6rem,7vw,5.5rem); color:#fff; text-transform:uppercase; letter-spacing:.08em; line-height:1.08; margin:0 0 .5rem; }
  .mh-title span { color:var(--gold); }
  .mh-pair { display:flex; justify-content:center; align-items:center; gap:1.5rem; margin:.4rem 0 0; flex-wrap:wrap; }
  .mh-pair img { width:clamp(100px,18%,180px); mix-blend-mode:screen; opacity:.88; }
  .mh-divider { display:flex; align-items:center; justify-content:center; gap:.75rem; margin:1.25rem auto; color:var(--gold); max-width:480px; }
  .mh-divider::before, .mh-divider::after { content:''; flex:1; height:1px; background:linear-gradient(90deg,transparent,var(--gold)); }
  .mh-divider::after { background:linear-gradient(270deg,transparent,var(--gold)); }
  .mh-divider span { font-size:.85rem; }
  .mh-social { display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:.75rem; margin-top:1rem; }
  .mh-btn { display:flex; align-items:center; justify-content:center; width:46px; height:46px; border-radius:50%; background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.12); cursor:pointer; padding:0; transition:all .25s ease; }
  .mh-btn:hover, .mh-btn[aria-expanded="true"] { background:var(--gold); border-color:var(--gold); transform:translateY(-3px); box-shadow:0 6px 20px rgba(201,164,107,.4); }
  .mh-btn:focus-visible { outline:2px solid var(--gold-light); outline-offset:3px; }
  .mh-btn svg { width:20px; height:20px; fill:#fff; flex-shrink:0; }
  .mh-dd { position:relative; }
  .mh-menu { position:absolute; bottom:calc(100% + 10px); left:50%; transform:translateX(-50%); background:#1e3d1f; border:1px solid rgba(201,164,107,.3); border-radius:10px; padding:.5rem 0; min-width:150px; display:none; flex-direction:column; z-index:200; box-shadow:0 8px 32px rgba(0,0,0,.5); text-align:start; }
  .mh-menu.open { display:flex; }
  .mh-menu a { padding:.5rem 1rem; color:var(--gold-light); font-size:.82rem; text-decoration:none; white-space:nowrap; transition:background .2s ease; }
  .mh-menu a:hover, .mh-menu a:focus-visible { background:rgba(255,255,255,.08); outline:none; }
  @media (max-width:520px) { .mh-menu { left:auto; right:-60px; transform:none; } .mh-dd:first-child .mh-menu { left:-20px; right:auto; } }
  @media (prefers-reduced-motion:reduce) { .mh-btn { transition:none; } .mh-btn:hover { transform:none; } }
</style>

<script>
  /* The three icon menus: click opens / closes, click elsewhere or Escape closes, arrow keys move between the entries. */
  (function () {
    var dds = document.querySelectorAll('.mh-dd');
    function closeAll(except) {
      dds.forEach(function (d) {
        if (d === except) return;
        d.querySelector('.mh-menu').classList.remove('open'); d.querySelector('.mh-btn').setAttribute('aria-expanded', 'false');
      });
    }
    dds.forEach(function (d) {
      var btn = d.querySelector('.mh-btn'), menu = d.querySelector('.mh-menu');
      btn.addEventListener('click', function (e) {
        e.stopPropagation(); closeAll(d);
        var open = menu.classList.toggle('open'); btn.setAttribute('aria-expanded', open ? 'true' : 'false');
        if (open) { var a = menu.querySelector('a'); if (a && e.detail === 0) a.focus(); }
      });
      menu.addEventListener('keydown', function (e) {
        var items = Array.prototype.slice.call(menu.querySelectorAll('a')), i = items.indexOf(document.activeElement);
        if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus(); }
        if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
      });
    });
    document.addEventListener('click', function () { closeAll(null); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeAll(null); } });
  })();
</script>
