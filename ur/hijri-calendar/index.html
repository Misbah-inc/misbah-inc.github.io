    body { background: var(--dark-bg); }

<script>
const MONTHS_UR = ['','محرّم','صفر','ربیع الاول','ربیع الثانی','جمادی الاول','جمادی الثانی','رجب','شعبان','رمضان','شوال','ذو القعدہ','ذوالحجہ'];
const GREG_M = ['','جنوری','فروری','مارچ','اپریل','مئی','جون','جولائی','اگست','ستمبر','اکتوبر','نومبر','دسمبر'];
const TYPE_UR = { martyrdom:'شہادت', birth:'ولادت', celebration:'جشن', commemoration:'یادگار' };

const EVENTS = {
  1: {
    1:  { t:'اسلامی نئے سال کا آغاز — یکم محرم', type:'celebration' },
    10: { t:'روز عاشورہ — امام حسین (ع) اور ان کے ساتھیوں کی شہادت کربلا میں', type:'martyrdom' },
  },
  2: {
    7:  { t:'امام علی بن موسیٰ الرضا (ع) کی شہادت', type:'martyrdom' },
    20: { t:'اربعین — امام حسین (ع) کی شہادت کا چالیسواں دن', type:'commemoration' },
    28: { t:'حضرت محمد (ص) اور امام حسن مجتبیٰ (ع) کی شہادت', type:'martyrdom' },
  },
  3: {
    8:  { t:'امام حسن عسکری (ع) کی شہادت', type:'martyrdom' },
    9:  { t:'امام مہدی (عج) کی امامت کا آغاز — دوسرا غدیر', type:'celebration' },
    10: { t:'حضرت خدیجہ (ع) اور حضرت محمد (ص) کی شادی', type:'celebration' },
    17: { t:'حضرت محمد (ص) اور امام جعفر صادق (ع) کی ولادت', type:'birth' },
    24: { t:'حضرت فاطمہ معصومہ (ع) کی قم میں آمد', type:'commemoration' },
    26: { t:'لیلۃ المبیت — امام علی (ع) کا نبی (ص) کے بستر پر سونا', type:'commemoration' },
  },
  4: { 11: { t:'امام حسن عسکری (ع) کی ولادت', type:'birth' } },
  5: {
    5:  { t:'حضرت زینب بنت علی (ع) کی ولادت', type:'birth' },
    13: { t:'امام علی بن ابی طالب (ع) کی کعبہ کے اندر ولادت', type:'birth' },
  },
  6: {
    3:  { t:'حضرت فاطمہ الزہرا (ع) کی شہادت', type:'martyrdom' },
    20: { t:'حضرت فاطمہ الزہرا (ع) کی ولادت', type:'birth' },
  },
  7: {
    1:  { t:'یکم رجب — روزہ رکھنا مستحب ہے', type:'celebration' },
    3:  { t:'امام علی الہادی (ع) کی ولادت', type:'birth' },
    10: { t:'امام محمد باقر (ع) کی ولادت', type:'birth' },
    25: { t:'امام موسیٰ کاظم (ع) کی شہادت', type:'martyrdom' },
    27: { t:'شب معراج — نبی کریم (ص) کا آسمانی سفر', type:'celebration' },
  },
  8: {
    3:  { t:'امام حسین بن علی (ع) کی ولادت', type:'birth' },
    4:  { t:'ابوالفضل العباس (ع) کی ولادت', type:'birth' },
    5:  { t:'امام علی بن الحسین زین العابدین (ع) کی ولادت', type:'birth' },
    15: { t:'امام مہدی (عج) کی ولادت — شب نیمہ شعبان', type:'birth' },
  },
  9: {
    1:  { t:'ماہ مبارک رمضان کا آغاز', type:'celebration' },
    19: { t:'پہلی شب قدر — ابن ملجم کا امام علی (ع) پر حملہ', type:'martyrdom' },
    21: { t:'امام علی بن ابی طالب (ع) امیر المومنین کی شہادت', type:'martyrdom' },
    23: { t:'شب قدر', type:'celebration' },
    27: { t:'شب قدر — دوسری روایت', type:'celebration' },
  },
  10: {
    1:  { t:'عید الفطر مبارک', type:'celebration' },
    25: { t:'امام جعفر صادق (ع) کی شہادت', type:'martyrdom' },
  },
  11: {
    1:  { t:'حضرت فاطمہ معصومہ (ع) کی ولادت', type:'birth' },
    11: { t:'امام علی رضا (ع) کی ولادت', type:'birth' },
  },
  12: {
    7:  { t:'امام محمد باقر (ع) کی شہادت', type:'martyrdom' },
    9:  { t:'یوم عرفہ', type:'celebration' },
    10: { t:'عید الاضحی مبارک', type:'celebration' },
    18: { t:'عید غدیر خم — نبی (ص) نے امام علی (ع) کی ولایت کا اعلان کیا', type:'celebration' },
    24: { t:'یوم مباہلہ', type:'celebration' },
    25: { t:'دحو الارض', type:'celebration' },
  },
};

function gToH(gy,gm,gd){let jd=Math.floor((1461*(gy+4800+Math.floor((gm-14)/12)))/4)+Math.floor((367*(gm-2-12*Math.floor((gm-14)/12)))/12)-Math.floor((3*Math.floor((gy+4900+Math.floor((gm-14)/12))/100))/4)+gd-32075;let l=jd-1948440+10632;let n=Math.floor((l-1)/10631);l=l-10631*n+354;let j=Math.floor((10985-l)/5316)*Math.floor((50*l)/17719)+Math.floor(l/5670)*Math.floor((43*l)/15238);l=l-Math.floor((30-j)/15)*Math.floor((17719*j)/50)-Math.floor(j/16)*Math.floor((15238*j)/43)+29;return{y:30*n+j-30,m:Math.floor((24*l)/709),d:l-Math.floor((709*Math.floor((24*l)/709))/24)};}
function hToG(hy,hm,hd){let jd=Math.floor((11*hy+3)/30)+354*hy+30*hm-Math.floor((hm-1)/2)+hd+1948440-385;let l=jd+68569;const n=Math.floor((4*l)/146097);l=l-Math.floor((146097*n+3)/4);const i=Math.floor((4000*(l+1))/1461001);l=l-Math.floor((1461*i)/4)+31;const j=Math.floor((80*l)/2447);const gd=l-Math.floor((2447*j)/80);l=Math.floor(j/11);return{y:100*(n-49)+i+l,m:j+2-12*l,d:gd};}
function hMonthLen(hy,hm){if(hm===12&&((11*hy+14)%30)<11)return 30;return hm%2===1?30:29;}
function weekday(gy,gm,gd){return new Date(gy,gm-1,gd).getDay();}

const _today=new Date();
const _todayH=gToH(_today.getFullYear(),_today.getMonth()+1,_today.getDate());
let curY=_todayH.y,curM=_todayH.m;

function render(){
  const g1=hToG(curY,curM,1);
  const gLast=hToG(curY,curM,hMonthLen(curY,curM));
  const rangeStr=`ہجری ${curY} · ${GREG_M[g1.m]} – ${GREG_M[gLast.m]} ${g1.y}`;
  document.getElementById('cal-month-en').textContent=MONTHS_UR[curM];
  document.getElementById('cal-month-range').textContent=rangeStr;
  document.getElementById('events-heading').textContent=`مناسبات — ${MONTHS_UR[curM]} ${curY}`;

  const grid=document.getElementById('hcal-grid');
  grid.innerHTML='';
  const daysInMonth=hMonthLen(curY,curM);
  const startDow=weekday(g1.y,g1.m,g1.d);
  for(let i=0;i<startDow;i++){const prevM=curM===1?12:curM-1,prevY=curM===1?curY-1:curY;const prevLen=hMonthLen(prevY,prevM);const pd=prevLen-startDow+1+i;const pg=hToG(prevY,prevM,pd);grid.appendChild(makeCell(pd,pg,false,null,true));}
  for(let d=1;d<=daysInMonth;d++){const g=hToG(curY,curM,d);const isToday=(curY===_todayH.y&&curM===_todayH.m&&d===_todayH.d);const ev=(EVENTS[curM]||{})[d]||null;grid.appendChild(makeCell(d,g,isToday,ev,false));}
  const total=startDow+daysInMonth;const trail=total%7===0?0:7-(total%7);
  for(let i=1;i<=trail;i++){const nextM=curM===12?1:curM+1,nextY=curM===12?curY+1:curY;const ng=hToG(nextY,nextM,i);grid.appendChild(makeCell(i,ng,false,null,true));}

  const list=document.getElementById('hcal-event-list');
  list.innerHTML='';
  const monthEvts=EVENTS[curM]||{};
  const days=Object.keys(monthEvts).map(Number).sort((a,b)=>a-b);
  if(!days.length){list.innerHTML='<p class="hcal-no-events">اس ماہ کوئی واقعہ درج نہیں۔</p>';return;}
  days.forEach(d=>{const ev=monthEvts[d];const g=hToG(curY,curM,d);const card=document.createElement('div');card.className='hcal-event-card';card.innerHTML=`<div class="hcal-event-stripe ${ev.type}"></div><div class="hcal-event-inner"><div class="hcal-event-date"><div class="hd">${d}</div><div class="gd">${GREG_M[g.m]} ${g.d}</div></div><div class="hcal-event-sep"></div><div class="hcal-event-text"><div class="hcal-event-title">${ev.t}</div><div class="hcal-event-type-label ${ev.type}">${TYPE_UR[ev.type]}</div></div></div>`;list.appendChild(card);});
}

function makeCell(hd,g,isToday,ev,otherMonth){const cell=document.createElement('div');cell.className='hcal-cell'+(isToday?' today':'')+(ev?' has-event':'')+(otherMonth?' other-month':'');cell.innerHTML=`<div class="hcal-hijri">${hd}</div><div class="hcal-greg">${GREG_M[g.m]} ${g.d}</div>`+(ev?`<div class="hcal-dots"><div class="hcal-dot ${ev.type}"></div></div><div class="hcal-event-label ${ev.type}">${ev.t}</div>`:'');return cell;}

document.getElementById('cal-prev').addEventListener('click',()=>{curM--;if(curM<1){curM=12;curY--;}render();});
document.getElementById('cal-next').addEventListener('click',()=>{curM++;if(curM>12){curM=1;curY++;}render();});
render();
</script>
</body>
</html>
